:root{--cyan:#dff7f6;--pink:#ffe7f0;--ink:#43505b;--muted:#7d8991;--white:rgba(255,255,255,.72);--line:rgba(255,255,255,.85)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f4ffff,#fff5f9 55%,#effcfc);min-height:100vh}body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(5px);pointer-events:none;z-index:-1}body:before{width:360px;height:360px;background:rgba(196,242,240,.55);left:-120px;top:80px}body:after{width:380px;height:380px;background:rgba(255,211,228,.5);right:-130px;bottom:30px}.wrap{max-width:980px;margin:auto;padding:64px 22px 80px}.hero{text-align:center;margin-bottom:38px}.eyebrow{font-size:12px;letter-spacing:.28em;color:#8b9ba3;text-transform:uppercase}.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(38px,8vw,68px);margin:13px 0 10px;color:#53616a}.hero p{margin:0;color:#829098;font-size:14px}.games{display:grid;gap:18px}.game{background:var(--white);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 16px 45px rgba(93,122,128,.09);backdrop-filter:blur(18px)}.game-head{display:flex;gap:16px;align-items:center;margin-bottom:20px}.num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--pink));font-family:Georgia,serif}.game h2{margin:0;font-size:21px;font-weight:600}.game .sub{margin:4px 0 0;color:var(--muted);font-size:13px}.hidden{display:none}.btn{border:0;border-radius:999px;padding:11px 20px;background:#fff;color:#52616a;box-shadow:0 6px 18px rgba(80,100,110,.1);cursor:pointer;font-size:14px}.btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#d9f5f3,#ffe2ed)}.question{background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:20px;margin-top:14px}.qno{font-size:11px;letter-spacing:.15em;color:#9aa5aa}.question h3{font-size:17px;line-height:1.6;margin:8px 0 15px}.options{display:grid;gap:9px}.option{padding:13px 15px;border-radius:15px;border:1px solid rgba(185,205,210,.5);background:rgba(255,255,255,.66);text-align:left;cursor:pointer;color:var(--ink)}.option:hover{background:#fff}.option.selected{border-color:#9bcfcf;background:linear-gradient(135deg,#ecffff,#fff0f5)}.result{text-align:center;padding:20px 5px 4px;font-family:Georgia,serif;font-size:21px}.result small{display:block;font-family:inherit;font-size:13px;color:var(--muted);margin-top:8px}.memory-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:700px;margin:18px auto}.card{display:block;width:100%;height:130px;min-height:130px;border:1px solid rgba(255,255,255,.95);border-radius:17px;padding:0;cursor:pointer;background:linear-gradient(145deg,#e2f8f7,#ffe8f0);box-shadow:0 7px 20px rgba(85,112,118,.1);overflow:hidden;position:relative;-webkit-appearance:none;appearance:none}.card .cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:25px;color:#87969d;background:linear-gradient(145deg,#e2f8f7,#ffe8f0);z-index:2}.card .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}.card.flipped .cover,.card.matched .cover{display:none}.card.flipped .photo,.card.matched .photo{display:block}.card.matched{box-shadow:0 0 0 2px rgba(255,255,255,.95),0 8px 22px rgba(85,112,118,.13)}.memory-stats{text-align:center;color:var(--muted);font-size:13px}.memory-done{text-align:center;font-family:Georgia,serif;font-size:22px;margin-top:18px}.reset{text-align:center;margin-top:18px}.who-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.who-btn{border:1px solid rgba(185,205,210,.55);background:rgba(255,255,255,.65);border-radius:18px;padding:15px;cursor:pointer;font-size:15px;color:var(--ink)}.who-btn:hover{background:#fff}.progress{height:6px;border-radius:9px;background:rgba(180,205,210,.25);overflow:hidden;margin:10px 0 16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#bfeeed,#ffcfe0);transition:.3s}.foot{text-align:center;color:#9aa5aa;font-size:12px;margin-top:30px}.backlink{display:inline-block;margin-top:12px;color:#829098;text-decoration:none}.backlink:hover{text-decoration:underline}@media(max-width:650px){.wrap{padding:42px 15px 60px}.game{padding:20px;border-radius:23px}.memory-grid{grid-template-columns:repeat(4,1fr);gap:7px}.card{height:92px;min-height:92px;border-radius:12px}.card .cover{font-size:19px}.who-grid{grid-template-columns:1fr}.hero h1{font-size:43px}}

const grid=document.getElementById('memory'),stats=document.getElementById('mstats'),done=document.getElementById('mdone');let deck=[],first=null,lock=false,matches=0,flips=0;function shuffle(a){return a.sort(()=>Math.random()-.5)}function initMemory(){deck=shuffle([...memoryImages.map((src,i)=>({src,id:i})),...memoryImages.map((src,i)=>({src,id:i}))]);grid.innerHTML=deck.map((c,i)=>`<button type="button" class="card" data-i="${i}"><span class="cover">♡</span><img class="photo" src="${c.src}" alt="memory"></button>`).join('');first=null;lock=false;matches=0;flips=0;done.innerHTML='';updateStats();grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>flip(c))}function updateStats(){stats.textContent=`已找到 ${matches} / 10　·　翻牌 ${flips} 次`}function flip(card){if(lock||card.classList.contains('flipped')||card.classList.contains('matched'))return;card.classList.add('flipped');flips++;updateStats();if(!first){first=card;return}const a=deck[+first.dataset.i],b=deck[+card.dataset.i];if(a.id===b.id){first.classList.add('matched');card.classList.add('matched');matches++;first=null;updateStats();if(matches===10)done.innerHTML='<div class="memory-done">全部找到了 ♡<br><span style="font:13px -apple-system,BlinkMacSystemFont,PingFang SC,sans-serif;color:#7d8991">看来我们的这些小事情，你都有好好记住。</span></div>'}else{lock=true;setTimeout(()=>{first.classList.remove('flipped');card.classList.remove('flipped');first=null;lock=false},700)}}document.getElementById('mreset').onclick=initMemory;initMemory();
